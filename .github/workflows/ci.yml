name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # required for azure/login's OIDC federated credential exchange
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t content-submission-api .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/content-submission-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/content-submission-service:latest

      # OIDC federated login - no client secret stored anywhere, see
      # docs/decisions/ADR-004-deploy-azure-container-apps.md.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container Apps
        run: |
          az containerapp update \
            --name app-sancruzblog-submission \
            --resource-group rg-sancruzblog-submission \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/content-submission-service:${{ github.sha }}
